<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Stream - Control de Ventas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Panda Stream</h1>
                <p class="text-sm text-slate-400">Control de Suscripciones y Ventas</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-emerald-900 text-emerald-300 px-3 py-1 rounded-full font-semibold">Moneda: S/. (Soles)</span>
            </div>
        </header>

        <!-- Resumen de Métricas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <p class="text-xs text-slate-400">Total Clientes Activos</p>
                <h2 id="total-clientes" class="text-2xl font-bold text-white">0</h2>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <p class="text-xs text-slate-400">Ventas Totales</p>
                <h2 id="total-ventas" class="text-2xl font-bold text-emerald-400">S/. 0.00</h2>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <p class="text-xs text-slate-400">Ganancia Neta Estimada</p>
                <h2 id="total-ganancia" class="text-2xl font-bold text-cyan-400">S/. 0.00</h2>
            </div>
        </div>

        <!-- Tabla de Clientes -->
        <div class="bg-slate-800 rounded-xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-lg text-white">Base de Datos de Clientes</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700 text-xs text-slate-300 uppercase">
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Servicio</th>
                            <th class="p-3">Vencimiento</th>
                            <th class="p-3">Costo / Venta</th>
                            <th class="p-3">WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo" class="divide-y divide-slate-700 text-sm">
                        <!-- Se llena con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const datosClientes = [
            { cliente: "Katy", telefono: "997243955", servicio: "Disney", vencimiento: "2026-10-21", costo: 6.0, venta: 10.0 },
            { cliente: "Prime", telefono: "936426800", servicio: "Prime Video", vencimiento: "2026-10-31", costo: 2.5, venta: 7.0 },
            { cliente: "Gianpierre", telefono: "902106379", servicio: "Paramount", vencimiento: "2026-11-02", costo: 3.9, venta: 7.0 },
            { cliente: "Aracely", telefono: "932507744", servicio: "Vix Premium", vencimiento: "2026-11-03", costo: 1.9, venta: 15.0 },
            { cliente: "Pedro", telefono: "959361261", servicio: "Netflix", vencimiento: "2026-11-05", costo: 9.0, venta: 12.0 },
            { cliente: "Cristian", telefono: "960441897", servicio: "Disney", vencimiento: "2026-11-04", costo: 3.9, venta: 10.0 },
            { cliente: "Disney", telefono: "924204068", servicio: "Disney", vencimiento: "2026-11-11", costo: 3.9, venta: 10.0 },
            { cliente: "Jenifer", telefono: "944461030", servicio: "HBO Max", vencimiento: "2026-11-13", costo: 3.9, venta: 8.0 }
        ];

        function cargarApp() {
            const tbody = document.getElementById("tabla-cuerpo");
            tbody.innerHTML = "";
            let totalV = 0;
            let totalC = 0;

            datosClientes.forEach(item => {
                totalV += item.venta;
                totalC += item.costo;

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-white">${item.cliente}</td>
                    <td class="p-3 text-slate-300">${item.servicio}</td>
                    <td class="p-3 text-amber-400">${item.vencimiento}</td>
                    <td class="p-3 text-slate-300">S/. ${item.costo.toFixed(2)} / <span class="text-emerald-400">S/. ${item.venta.toFixed(2)}</span></td>
                    <td class="p-3">
                        <a href="https://wa.me/51${item.telefono}?text=Hola%20${item.cliente},%20tu%20cuenta%20de%20${item.servicio}%20está%20por%20vencer." target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold inline-flex items-center">
                            <i class="fa-brands fa-whatsapp mr-1 text-sm"></i> Chat
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("total-clientes").innerText = datosClientes.length;
            document.getElementById("total-ventas").innerText = `S/. ${totalV.toFixed(2)}`;
            document.getElementById("total-ganancia").innerText = `S/. ${(totalV - totalC).toFixed(2)}`;
        }

        cargarApp();
    </script>
</body>
  </html>
