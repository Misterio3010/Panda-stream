<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Stream - Control de Ventas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Panda Stream</h1>
                <p class="text-sm text-slate-400">Control de Suscripciones y Ventas</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-emerald-900 text-emerald-300 px-3 py-1 rounded-full font-semibold">Soles (S/.)</span>
            </div>
        </header>

        <!-- Resumen de Métricas (Totales Históricos Indestructibles) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <p class="text-xs text-slate-400">Total Clientes Vendidos</p>
                <h2 id="total-clientes" class="text-2xl font-bold text-white">0</h2>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <p class="text-xs text-slate-400">Ventas Totales Históricas</p>
                <h2 id="total-ventas" class="text-2xl font-bold text-emerald-400">S/. 0.00</h2>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <p class="text-xs text-slate-400">Ganancia Neta Histórica</p>
                <h2 id="total-ganancia" class="text-2xl font-bold text-cyan-400">S/. 0.00</h2>
            </div>
        </div>

        <!-- Formulario para Nueva Venta -->
        <div class="bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700 mb-6">
            <h3 class="font-bold text-lg text-white mb-4"><i class="fa-solid fa-user-plus mr-2 text-emerald-400"></i>Registrar Nueva Venta</h3>
            <form id="form-venta" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <input type="text" id="input-cliente" placeholder="Nombre del cliente" required class="bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
                <input type="text" id="input-telefono" placeholder="WhatsApp (ej. 999888777)" required class="bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
                <input type="email" id="input-correo" placeholder="Correo electrónico (opcional)" class="bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
                <input type="text" id="input-servicio" placeholder="Servicio (ej. Disney, Netflix)" required class="bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
                <input type="date" id="input-vencimiento" required class="bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
                <input type="number" step="0.1" id="input-costo" placeholder="Costo proveedor (S/.)" required class="bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
                <input type="number" step="0.1" id="input-venta" placeholder="Precio venta (S/.)" required class="bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 sm:col-span-2 lg:col-span-2">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-lg transition text-sm flex items-center justify-center">
                    <i class="fa-solid fa-plus mr-1"></i> Guardar Venta
                </button>
            </form>
        </div>

        <!-- Tabla de Clientes -->
        <div class="bg-slate-800 rounded-xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700">
                <h3 class="font-bold text-lg text-white">Base de Datos de Clientes</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700 text-xs text-slate-300 uppercase">
                            <th class="p-3">Cliente / Correo</th>
                            <th class="p-3">Servicio</th>
                            <th class="p-3">Vencimiento / Días</th>
                            <th class="p-3">Costo / Venta</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo" class="divide-y divide-slate-700 text-sm">
                        <!-- Se llena con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Cargamos tus clientes activos de la pantalla
        let datosClientes = JSON.parse(localStorage.getItem("panda_ventas")) || [];

        // Creamos un registro histórico separado y blindado para que las ventas TOTALES no bajen nunca
        let historialAcumulado = JSON.parse(localStorage.getItem("panda_historial"));
        if (!historialAcumulado) {
            // Si es la primera vez que se activa, toma exactamente los 78 clientes y dinero que ya tienes guardados
            historialAcumulado = {
                totalClientesVendidos: datosClientes.length,
                ventasTotales: datosClientes.reduce((acc, item) => acc + Number(item.venta), 0),
                costosTotales: datosClientes.reduce((acc, item) => acc + Number(item.costo), 0)
            };
        } else {
            // Asegurarnos de que el histórico nunca sea menor a lo que ya tienes visible (por seguridad)
            if (historialAcumulado.totalClientesVendidos < datosClientes.length) {
                historialAcumulado.totalClientesVendidos = datosClientes.length;
            }
        }

        function calcularDiasRestantes(fechaVencimiento) {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            const venc = new Date(fechaVencimiento + "T00:00:00");
            const diferenciaTiempo = venc - hoy;
            return Math.ceil(diferenciaTiempo / (1000 * 60 * 60 * 24));
        }

        function actualizarApp() {
            const tbody = document.getElementById("tabla-cuerpo");
            tbody.innerHTML = "";

            datosClientes.forEach((item, index) => {
                const dias = calcularDiasRestantes(item.vencimiento);
                let badgeDias = "";
                if (dias < 0) {
                    badgeDias = `<span class="bg-red-900 text-red-300 px-2 py-0.5 rounded text-xs font-bold">Vencido (${Math.abs(dias)}d)</span>`;
                } else if (dias === 0) {
                    badgeDias = `<span class="bg-amber-900 text-amber-300 px-2 py-0.5 rounded text-xs font-bold">Vence hoy</span>`;
                } else {
                    badgeDias = `<span class="bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded text-xs font-bold">Quedan ${dias} días</span>`;
                }

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="p-3">
                        <div class="font-semibold text-white">${item.cliente}</div>
                        <div class="text-xs text-slate-400">${item.correo || 'Sin correo'}</div>
                    </td>
                    <td class="p-3 text-slate-300">${item.servicio}</td>
                    <td class="p-3">
                        <div class="text-amber-400 text-xs mb-1">${item.vencimiento}</div>
                        <div>${badgeDias}</div>
                    </td>
                    <td class="p-3 text-slate-300">S/. ${Number(item.costo).toFixed(2)} / <span class="text-emerald-400">S/. ${Number(item.venta).toFixed(2)}</span></td>
                    <td class="p-3 text-center space-y-1">
                        <div class="flex justify-center gap-1">
                            <a href="https://wa.me/51${item.telefono}?text=Hola%20${item.cliente},%20tu%20cuenta%20de%20${item.servicio}%20está%20por%20vencer." target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-xs font-bold inline-flex items-center" title="Enviar WhatsApp">
                                <i class="fa-brands fa-whatsapp"></i>
                            </a>
                            <button onclick="renovarCliente(${index})" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-xs font-bold" title="Renovar 1 Mes">
                                <i class="fa-solid fa-rotate-right"></i> +1M
                            </button>
                            <button onclick="eliminarCliente(${index})" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1 rounded text-xs font-bold" title="Eliminar Cliente">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // AQUÍ ESTÁ EL TRUCO: Mostramos los números fijos del historial que NUNCA bajan
            document.getElementById("total-clientes").innerText = historialAcumulado.totalClientesVendidos;
            document.getElementById("total-ventas").innerText = `S/. ${historialAcumulado.ventasTotales.toFixed(2)}`;
            document.getElementById("total-ganancia").innerText = `S/. ${(historialAcumulado.ventasTotales - historialAcumulado.costosTotales).toFixed(2)}`;
            
            // Guardamos todo en la memoria
            localStorage.setItem("panda_ventas", JSON.stringify(datosClientes));
            localStorage.setItem("panda_historial", JSON.stringify(historialAcumulado));
        }

        document.getElementById("form-venta").addEventListener("submit", function(e) {
            e.preventDefault();
            const costoVal = parseFloat(document.getElementById("input-costo").value);
            const ventaVal = parseFloat(document.getElementById("input-venta").value);

            const nuevoCliente = {
                cliente: document.getElementById("input-cliente").value,
                telefono: document.getElementById("input-telefono").value,
                correo: document.getElementById("input-correo").value,
                servicio: document.getElementById("input-servicio").value,
                vencimiento: document.getElementById("input-vencimiento").value,
                costo: costoVal,
                venta: ventaVal
            };

            datosClientes.push(nuevoJSON = nuevoCliente); // Agrega a la tabla
            
            // Suma permanente al historial totalizador
            historialAcumulado.totalClientesVendidos += 1;
            historialAcumulado.ventasTotales += ventaVal;
            historialAcumulado.costosTotales += costoVal;

            actualizarApp();
            this.reset();
        });

        function renovarCliente(index) {
            let fechaActual = new Date(datosClientes[index].vencimiento + "T00:00:00");
            if (isNaN(fechaActual.getTime())) {
                fechaActual = new Date();
            }
            fechaActual.setMonth(fechaActual.getMonth() + 1);
            
            let anio = fechaActual.getFullYear();
            let mes = String(fechaActual.getMonth() + 1).padStart(2, '0');
            let dia = String(fechaActual.getDate()).padStart(2, '0');
            
            datosClientes[index].vencimiento = `${anio}-${mes}-${dia}`;
            actualizarApp();
        }

        function eliminarCliente(index) {
            if (confirm("¿Estás seguro de eliminar este cliente de la tabla?")) {
                // Al eliminar de la tabla, el cliente sale de la lista visual,
                // PERO el contador de total de ventas y el dinero se quedan intactos en el historial.
                datosClientes.splice(index, 1);
                actualizarApp();
            }
        }

        actualizarApp();
    </script>
</body>
</html>
